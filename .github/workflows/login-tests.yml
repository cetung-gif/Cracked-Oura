name: Login regression tests

on:
  push:
    paths:
      - backend/src/automation.py
      - backend/tests/**
      - .github/workflows/login-tests.yml
  pull_request:
    paths:
      - backend/src/automation.py
      - backend/tests/**
      - .github/workflows/login-tests.yml

permissions:
  contents: read

jobs:
  login-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install pytest playwright
      - run: python -m playwright install --with-deps chromium
      - run: python -m pytest backend/tests -q
